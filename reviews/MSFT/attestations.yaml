zero_if_not_presented:
  - metric: commercial_paper
    fiscal_labels: [FY2022, FY2026]
    absent_label_pattern: (?i)commercial paper
    rationale: No commercial paper balance presented at these fiscal year ends.
  - metric: preferred_equity
    fiscal_labels: [FY2022, FY2023, FY2024, FY2025, FY2026]
    absent_label_pattern: (?i)preferred stock|preference shares
    rationale: No preferred stock is presented.
    include_latest: true
