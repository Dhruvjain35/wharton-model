# Alphabet accounting review ledger.
#
# Every entry is PROPOSED. Nothing here changes a number until a teammate sets
# status: approved and puts their own name in reviewer. The AI that drafted these
# cannot approve them (the engine refuses).
#
# Each quote is checked by `fre verify-ledger`: it must appear verbatim in the
# snapshotted filing text and contain the number it supports.

adjustments:

  # ---------------------------------------------------------------- investment gains
  # Alphabet's net income includes mark-to-market gains on equity stakes. They are real
  # economic value but not operating performance, and they swing: +12.4bn in 2021,
  # -3.5bn in 2022, +24.1bn in 2025. Applied to every year so trends stay comparable.

  - id: GOOGL-FY2021-EQGAIN
    metric: net_income
    fiscal_label: FY2021
    category: investment-gains
    delta_formula: -equity_securities_gain * (1 - tax_rate)
    assumptions: &tax
      tax_rate:
        value: 0.21
        rationale: >-
          US federal statutory rate as an approximation of the deferred tax on the gains.
          Alphabet does not disclose the tax effect of these gains; state taxes ignored.
    rationale: Remove after-tax gains on equity securities so net income reflects operations.
    evidence: &eq2021
      source: 10-K FY2022, OI&E table
      snapshot_id: abc7fcae76c3e949
      quote: Gain (loss) on equity securities, net 5,592 12,380 ( 3,455 )
      fact: equity_securities_gain
    author: Claude (AI-proposed)
    status: proposed

  - id: GOOGL-FY2022-EQGAIN
    metric: net_income
    fiscal_label: FY2022
    category: investment-gains
    delta_formula: -equity_securities_gain * (1 - tax_rate)
    assumptions: *tax
    rationale: FY2022 was a net loss on equity securities; removing it raises net income.
    evidence:
      source: 10-K FY2023, OI&E table
      snapshot_id: 3a539205c6b66cd8
      quote: Gain (loss) on equity securities, net (3,455) 392
      fact: equity_securities_gain
    author: Claude (AI-proposed)
    status: proposed

  - id: GOOGL-FY2023-EQGAIN
    metric: net_income
    fiscal_label: FY2023
    category: investment-gains
    delta_formula: -equity_securities_gain * (1 - tax_rate)
    assumptions: *tax
    rationale: Remove after-tax gains on equity securities so net income reflects operations.
    evidence:
      source: 10-K FY2023, OI&E table
      snapshot_id: 3a539205c6b66cd8
      quote: Gain (loss) on equity securities, net (3,455) 392
      fact: equity_securities_gain
    author: Claude (AI-proposed)
    status: proposed

  - id: GOOGL-FY2024-EQGAIN
    metric: net_income
    fiscal_label: FY2024
    category: investment-gains
    delta_formula: -equity_securities_gain * (1 - tax_rate)
    assumptions: *tax
    rationale: Remove after-tax gains on equity securities so net income reflects operations.
    evidence:
      source: 10-K FY2025, OI&E table
      snapshot_id: 938c25cc7e2ea066
      quote: Gain (loss) on equity securities, net 3,714 24,080
      fact: equity_securities_gain
    author: Claude (AI-proposed)
    status: proposed

  - id: GOOGL-FY2025-EQGAIN
    metric: net_income
    fiscal_label: FY2025
    category: investment-gains
    delta_formula: -equity_securities_gain * (1 - tax_rate)
    assumptions: *tax
    rationale: >-
      The FY2025 gain is 15% of pretax income (24,080 / 158,826) and is mostly unrealized fair-value
      adjustments on non-marketable (private) securities. It explains a large part of
      FY2025 EPS growth that did not come from operations.
    evidence:
      source: 10-K FY2025, MD&A
      snapshot_id: 938c25cc7e2ea066
      quote: net gains on equity securities of $24.1 billion, primarily related to unrealized gains on our non-marketable equity securities
    author: Claude (AI-proposed)
    status: proposed

  # ---------------------------------------------------------------- depreciation estimate
  - id: GOOGL-FY2023-USEFUL-LIFE
    metric: operating_income
    fiscal_label: FY2023
    category: depreciation-assumptions
    delta_formula: -depreciation_effect
    constants:
      depreciation_effect:
        value: 3.9e9
        snapshot_id: 3a539205c6b66cd8
        quote: the effect of this change in estimate was a reduction in depreciation expense of $ 3.9 billion and an increase in net income of $ 3.0 billion
    rationale: >-
      Server life went from four to six years in 2023. Removing the effect puts FY2023
      on the FY2022 basis for trend comparison. The effect continues in FY2024-FY2025
      but the filings do not quantify it for those years, so those years are NOT adjusted:
      treat reported FY2024-FY2025 margins as benefiting from a longer life assumption.
    evidence: 10-K FY2023, Note 1 (quote above)
    author: Claude (AI-proposed)
    status: proposed

  - id: GOOGL-FY2023-USEFUL-LIFE-NI
    metric: net_income
    fiscal_label: FY2023
    category: depreciation-assumptions
    delta_formula: -net_income_effect
    constants:
      net_income_effect:
        value: 3.0e9
        snapshot_id: 3a539205c6b66cd8
        quote: the effect of this change in estimate was a reduction in depreciation expense of $ 3.9 billion and an increase in net income of $ 3.0 billion
    rationale: Company-disclosed after-tax effect of the same change (0.24 per diluted share).
    evidence: 10-K FY2023, Note 1 (quote above)
    author: Claude (AI-proposed)
    status: proposed

  # ---------------------------------------------------------------- restructuring
  # Presented as discrete charges, but they recurred in consecutive years. The team
  # should decide whether "restructuring" is a cost of running Alphabet.

  - id: GOOGL-FY2023-RESTRUCTURING
    metric: operating_income
    fiscal_label: FY2023
    category: restructuring
    delta_formula: severance + office_exit + accelerated_rent
    constants:
      severance:
        value: 2.1e9
        snapshot_id: 3a539205c6b66cd8
        quote: employee severance and related charges of $2.1 billion
      office_exit:
        value: 1.8e9
        snapshot_id: 3a539205c6b66cd8
        quote: exit charges recorded during the year ended December 31, 2023, were $1.8 billion
      accelerated_rent:
        value: 269e6
        snapshot_id: 3a539205c6b66cd8
        quote: we incurred $269 million in accelerated rent and accelerated depreciation
    rationale: Add back workforce-reduction and office-space charges. Recurred in FY2024 (next entry).
    evidence: 10-K FY2023, MD&A Other Information (quotes above)
    author: Claude (AI-proposed)
    status: proposed

  - id: GOOGL-FY2024-RESTRUCTURING
    metric: operating_income
    fiscal_label: FY2024
    category: restructuring
    delta_formula: severance + office_space
    constants:
      severance:
        value: 1.0e9
        snapshot_id: da8f7c08c1b5256f
        quote: Employee severance and related charges for the year ended December 31, 2024 were $1.0 billion
      office_space:
        value: 796e6
        snapshot_id: da8f7c08c1b5256f
        quote: Office space charges, including accelerated rent and accelerated depreciation, for the year ended December 31, 2024 were $796 million
    rationale: Second consecutive year of these charges; approving both years treats a recurring cost as one-time.
    evidence: 10-K FY2024, MD&A Other Information (quotes above)
    author: Claude (AI-proposed)
    status: proposed

  # ---------------------------------------------------------------- legal
  - id: GOOGL-FY2025-LEGAL
    metric: operating_income
    fiscal_label: FY2025
    category: legal
    delta_formula: ec_fine + legal_accrual
    constants:
      ec_fine:
        value: 3.5e9
        snapshot_id: 938c25cc7e2ea066
        quote: largely the result of the $3.5 billion EC fine accrued in the third quarter of 2025 and a $1.4 billion legal accrual made in the second quarter of 2025
      legal_accrual:
        value: 1.4e9
        snapshot_id: 938c25cc7e2ea066
        quote: largely the result of the $3.5 billion EC fine accrued in the third quarter of 2025 and a $1.4 billion legal accrual made in the second quarter of 2025
    rationale: >-
      Pre-tax operating view only; net income is not adjusted because the tax
      deductibility of the fine is not disclosed. Regulatory cost may be structural
      for Alphabet: the PRD forbids removing legal costs automatically.
    evidence: 10-K FY2025, MD&A General and Administrative (quote above)
    author: Claude (AI-proposed)
    status: proposed

# Observations change no numbers. They explain what the numbers cannot.
observations:
  - id: GOOGL-FY2022-MANDIANT
    category: scope-change
    fiscal_labels: [FY2022, FY2023]
    note: >-
      Mandiant was acquired on 2022-09-12 and reported in Google Cloud from that date.
      FY2022-FY2023 growth includes acquired revenue; the amount is not separately disclosed here.
    snapshot_id: abc7fcae76c3e949
    quote: we closed the acquisition of Mandiant for a total purchase price of $6.1 billion
  - id: GOOGL-FY2025-TAX-LAW-CFO
    category: working-capital-and-tax-timing
    fiscal_labels: [FY2025]
    note: >-
      The July 4, 2025 US tax law allows immediate R&D expensing and accelerated depreciation;
      the cash benefit is inside FY2025 operating cash flow. FY2025 CFO, cash FCF and cash
      conversion are flattered by an amount the filing does not quantify in this passage.
      Cash taxes paid fell from 27.4bn (FY2024) to 21.5bn (FY2025).
    snapshot_id: 938c25cc7e2ea066
    quote: the effects of which are included in operating cash flows for the year ended December 31, 2025
  - id: GOOGL-FY2025-WAYMO-SBC
    category: stock-compensation
    fiscal_labels: [FY2025]
    note: >-
      A 2.1bn Waymo employee compensation charge sits in R&D. Kept as an expense: SBC is an
      economic cost (PRD A2, B3). Listed so nobody removes it as "one-time".
    snapshot_id: 938c25cc7e2ea066
    quote: included a $2.1 billion employee compensation charge recognized in the fourth quarter for Waymo
